name: Game checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Test startup and every monster type
        run: node --test tests/game.test.cjs
