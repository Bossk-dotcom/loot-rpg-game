<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Loot & Battle RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <header id="hud">
      <div id="zone-title">Zone: Town (Safe Area)</div>
      <div id="gold-display">💰 Gold: 0</div>
      <div id="hp-container">
        <span>HP: <span id="hp-text">100/100</span></span>
        <div id="player-hp-bar-bg"><div id="player-hp-bar-fill"></div></div>
      </div>
      <div>Atk Power: ⚔️<span id="atk-text">10</span></div>
    </header>

    <div id="canvas-container">
      <canvas id="gameCanvas" width="800" height="450"></canvas>
      <div id="controls-tip"><b>WASD / Arrow Keys</b> to Move | <b>Spacebar or Left-Click</b> to Swing Sword</div>
    </div>

    <div id="status-banner">Welcome to Town! Walk right to battle or hit the dummy to train!</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
